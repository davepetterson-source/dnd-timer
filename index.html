(()=>{'use strict';
const $=id=>document.getElementById(id), q=(s)=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const state={hours:0,minutes:45,start:null,allow:{favourites:false,alarms:true,music:false},end:null,armed:null,name:'',schedules:(()=>{try{return JSON.parse(localStorage.getItem('kq-c44-schedules')||'[]')}catch(e){return []}})()};
const live=()=>new Date(); const total=()=>state.hours*60+state.minutes; const duration=()=>Math.max(1,total());
function when(){if(state.start===null)return live();const d=live();d.setHours(state.start.h,state.start.m,0,0);if(d<=live())d.setDate(d.getDate()+1);return d;}
function formatted(d){return d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}function dayName(d){const t=live(),d0=new Date(t.getFullYear(),t.getMonth(),t.getDate());const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const days=Math.round((x-d0)/86400000);return days===0?'today':days===1?'tomorrow':d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});}
function save(){try{localStorage.setItem('kq-c44-schedules',JSON.stringify(state.schedules));}catch(e){}}
function render(){const now=live();if(state.end&&state.end<=now){state.end=null;state.name='';announce('Timer finished.');}
if(state.armed&&state.armed<=now){state.end=new Date(state.armed.getTime()+duration()*60000);state.armed=null;announce('Timer started.');}
if(state.end){let seconds=Math.max(0,Math.ceil((state.end-now)/1000)),h=Math.floor(seconds/3600),m=Math.floor((seconds%3600)/60),s=seconds%60;$('clock').textContent=h?`${pad(h)}:${pad(m)}`:`${pad(m)}:${pad(s)}`;$('date').textContent=state.name?`Quiet · ${state.name}`:'Quiet timer running';}
else{$('clock').textContent=formatted(now);$('date').textContent=state.armed?`Starts ${formatted(state.armed)}`:now.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});}
$('hours-display').textContent=pad(state.hours)+' h';$('minutes-display').textContent=pad(state.minutes)+' m';const fin=new Date(when().getTime()+duration()*60000);$('finish').textContent=`Finishes at ${formatted(fin)} ${dayName(fin)}`;
for(let key of ['favourites','alarms','music']){$('led-'+key).classList.toggle('on',state.allow[key]);$('strike-'+key).classList.toggle('hidden',state.allow[key]);}
$('now-dim').classList.toggle('hidden',!state.start);$('mode-active').classList.toggle('hidden',!state.start);$('start-live-label').classList.toggle('hidden',!(state.end||state.armed));$('start-live-label').textContent=state.armed?'Cancel Sleep Timer':'Stop Sleep Timer';$('start').setAttribute('aria-label',state.end?'Stop timer':state.armed?'Cancel scheduled timer':state.start?'Arm sleep timer':'Start sleep timer');
}
function announce(msg){$('announce').textContent=msg;}
function modal(html){$('modal').innerHTML=html;$('cover').classList.remove('hidden');}
function close(){$('cover').classList.add('hidden');render();}
function configDuration(){modal(`<h2>Set duration</h2><p>Roll the hours and minutes. This will update the finishing time on the home screen.</p><div class="barrels"><div class="barrel" data-wheel="hours"><button data-adjust="h+">⌃</button><b id="dh">${pad(state.hours)}</b><button data-adjust="h-">⌄</button><small>HOURS</small></div><div class="barrel" data-wheel="minutes"><button data-adjust="m+">⌃</button><b id="dm">${pad(state.minutes)}</b><button data-adjust="m-">⌄</button><small>MINUTES</small></div></div><div class="actions"><button class="action primary" data-close>Done</button></div>`);}
function configTime(){const t=state.start||{h:13,m:0};modal(`<h2>Start at a time</h2><p>Choose a clock time for a one-off start. A time already passed today means tomorrow.</p><div class="barrels"><div class="barrel" data-wheel="startH"><button data-adjust="sh+">⌃</button><b id="sh">${pad(t.h)}</b><button data-adjust="sh-">⌄</button><small>HOUR</small></div><div class="barrel" data-wheel="startM"><button data-adjust="sm+">⌃</button><b id="sm">${pad(t.m)}</b><button data-adjust="sm-">⌄</button><small>MINUTE</small></div></div><div class="actions"><button class="action" data-action="now">Now instead</button><button class="action primary" data-action="savetime">Use this time</button></div>`);window._st={...t};}
function adjust(code){if(code==='h+')state.hours=(state.hours+1)%100;if(code==='h-')state.hours=(state.hours+99)%100;if(code==='m+')state.minutes=(state.minutes+1)%60;if(code==='m-')state.minutes=(state.minutes+59)%60;if(code.startsWith('s')){if(!window._st)window._st={h:13,m:0};let k=code.startsWith('sh')?'h':'m',n=k==='h'?24:60;window._st[k]=(window._st[k]+(code.endsWith('+')?1:n-1))%n;}
for(let [id,v] of [['dh',state.hours],['dm',state.minutes],['sh',window._st?.h],['sm',window._st?.m]])if($(id)&&v!==undefined)$(id).textContent=pad(v);render();}
function begin(name,mins){if(mins){state.hours=Math.floor(mins/60);state.minutes=mins%60;state.start=null;}if(!duration()){announce('Choose a duration.');return;}state.name=name||'';state.end=null;state.armed=null;if(state.start){state.armed=when();announce(`Timer armed for ${formatted(state.armed)}.`);}else{state.end=new Date(Date.now()+duration()*60000);announce('Sleep timer started.');}render();}
function manage(){let items=state.schedules.map((s,i)=>`<div class="schedule-item"><div><b>${escapeHtml(s.name)}</b><div>${s.time} · ${s.minutes}m · ${s.days.length?s.days.join(', '):'Once'}</div></div><button data-remove="${i}" aria-label="Delete ${escapeHtml(s.name)}">✕</button></div>`).join('')||'<p>No automatic schedules saved yet.</p>';
modal(`<h2>Manage Schedules</h2><p>Independent of the Quick Presets. In this browser demo they trigger only while this page is open.</p>${items}<div class="actions"><button class="action" data-close>Back</button><button class="action primary" data-action="newSchedule">+ Add schedule</button></div>`);}
function scheduleForm(){modal(`<h2>New schedule</h2><div class="formrow"><label for="sn">Name</label><input id="sn" value="Quiet Time" maxlength="30"></div><div class="formrow"><label for="st">Starts</label><input id="st" type="time" value="23:00"></div><div class="formrow"><label for="sd">Minutes</label><input id="sd" type="number" min="1" max="5999" value="60"></div><h3>Repeat on</h3><div class="checkrow">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<label><input type="checkbox" class="weekday" value="${d}">${d}</label>`).join('')}</div><p>No days selected means once, at the next occurrence of that clock time.</p><h3>Allow through</h3><div class="checkrow">${['favourites','alarms','music'].map(k=>`<label><input type="checkbox" class="permission" value="${k}" ${state.allow[k]?'checked':''}>${k}</label>`).join('')}</div><div class="actions"><button class="action" data-action="schedules">Cancel</button><button class="action primary" data-action="saveSchedule">Save</button></div>`);}
function escapeHtml(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function saveSchedule(){let mins=Number($('sd').value),t=$('st').value;if(!t||!Number.isFinite(mins)||mins<1||mins>5999){announce('Enter a valid time and duration.');return;}state.schedules.push({id:Date.now(),name:$('sn').value.trim()||'Quiet Time',time:t,minutes:mins,days:[...document.querySelectorAll('.weekday:checked')].map(e=>e.value),allow:Object.fromEntries(['favourites','alarms','music'].map(k=>[k,!!document.querySelector(`.permission[value="${k}"]:checked`)])),fired:''});save();manage();}
function checkSchedules(){const d=live();const weekday=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()],minuteKey=d.toISOString().slice(0,10)+'/'+formatted(d);for(let s of [...state.schedules]){if(s.time===formatted(d)&&(!s.days.length||s.days.includes(weekday))&&s.fired!==minuteKey){s.fired=minuteKey;state.allow={...s.allow};state.start=null;begin(s.name,s.minutes);if(!s.days.length)state.schedules=state.schedules.filter(x=>x.id!==s.id);save();}}}
$('phone').addEventListener('click',e=>{let el=e.target.closest('button');if(!el)return;
if(el.dataset.adjust){adjust(el.dataset.adjust);return;}if(el.dataset.close!==undefined){close();return;}if(el.dataset.remove!==undefined){state.schedules.splice(Number(el.dataset.remove),1);save();manage();return;}
if(el.dataset.toggle){let k=el.dataset.toggle;state.allow[k]=!state.allow[k];render();return;}if(el.dataset.preset){close();begin(el.dataset.preset,Number(el.dataset.min));return;}
switch(el.dataset.action){case 'settings':modal('<h2>KipQuiet · C44</h2><p>This prototype uses the original approved digital-moon artwork, not an SVG recreation.</p><p>The timer, presets, LEDs and schedules operate as a browser simulation. They do not change Android sound settings or run when the page is closed.</p><div class="actions"><button class="action primary" data-close>Close</button></div>');break;
case 'now':state.start=null;close();break;case 'time':configTime();break;case 'savetime':state.start={...window._st};close();break;
case 'hplus':adjust('h+');break;case 'hminus':adjust('h-');break;case 'mplus':adjust('m+');break;case 'mminus':adjust('m-');break;
case 'duration':configDuration();break;case 'start':if(state.end||state.armed){state.end=null;state.armed=null;state.name='';announce('Timer stopped.');}else begin('',null);render();break;
case 'schedules':manage();break;case 'newSchedule':scheduleForm();break;case 'saveSchedule':saveSchedule();break;}
});
let wheelStart=null;$('phone').addEventListener('touchstart',e=>{let target=e.target.closest('[data-wheel]');if(target)wheelStart={y:e.touches[0].clientY,kind:target.dataset.wheel};},{passive:true});$('phone').addEventListener('touchend',e=>{if(!wheelStart)return;let dy=e.changedTouches[0].clientY-wheelStart.y;if(Math.abs(dy)>15){let codes={hours:['h+','h-'],minutes:['m+','m-'],startH:['sh+','sh-'],startM:['sm+','sm-']};adjust(codes[wheelStart.kind][dy<0?0:1]);}wheelStart=null;},{passive:true});
$('phone').addEventListener('wheel',e=>{let target=e.target.closest('[data-wheel]');if(!target)return;e.preventDefault();let codes={hours:['h+','h-'],minutes:['m+','m-'],startH:['sh+','sh-'],startM:['sm+','sm-']};adjust(codes[target.dataset.wheel][e.deltaY>0?0:1]);},{passive:false});
$('cover').addEventListener('click',e=>{if(e.target===$('cover'))close();});document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});render();setInterval(()=>{checkSchedules();render();},1000);
})();</script></body></html>
