(()=>{'use strict';const $=id=>document.getElementById(id),screen=$('screen');const storageKey='kipquiet-c45-demo';const initial={hours:1,minutes:0,mode:'now',startHour:13,startMinute:0,allowed:{favourites:true,alarms:true,music:true},schedules:[{id:1,name:'Bedroom Quiet',time:'22:30',hours:3,minutes:0,days:[],allowed:{favourites:false,alarms:true,music:false},enabled:true}],presets:[{name:'Sleep',minutes:480},{name:'Nap',minutes:30},{name:'Relax',minutes:20},{name:'Focus',minutes:45}]};let data;try{data=Object.assign({},initial,JSON.parse(localStorage.getItem(storageKey)||'{}'))}catch{data=structuredClone(initial)}if(!data.allowed)data.allowed={...initial.allowed};if(!Array.isArray(data.schedules))data.schedules=[...initial.schedules];let active=null, armed=null, modal=null;const pad=n=>String(n).padStart(2,'0');const total=()=>data.hours*60+data.minutes;const save=()=>{try{localStorage.setItem(storageKey,JSON.stringify(data))}catch{}};function fmt(d){return d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}function durationString(m){return Math.floor(m/60)+'h '+pad(m%60)+'m'}function futureTime(h,m,now=new Date()){let d=new Date(now);d.setHours(h,m,0,0);if(d.getTime()<=now.getTime())d.setDate(d.getDate()+1);return d}function getStart(){return data.mode==='now'?new Date():futureTime(data.startHour,data.startMinute)}function finish(){let d=new Date(getStart());d.setMinutes(d.getMinutes()+total());return d}function announce(t){$('announce').textContent=t}function render(){const now=new Date();if(armed&&now>=armed.start){active={end:new Date(armed.start.getTime()+armed.duration*60000),duration:armed.duration,start:armed.start,source:armed.source};armed=null;announce('Timer started')}if(active&&now>=active.end){active=null;announce('Timer finished')}screen.classList.toggle('running',!!active);if(active){let left=Math.max(0,Math.ceil((active.end-now)/1000)),m=Math.floor(left/60),s=left%60;$('clockTime').textContent=pad(Math.floor(m/60))+':'+pad(m%60);$('clockDate').textContent='Remaining · '+pad(s)+'s';$('clockState').textContent='';let pct=Math.max(0,100*(active.end-now)/(active.duration*60000));$('progress').style.setProperty('--pct',pct+'%');$('moon').textContent='◕'}else{$('clockTime').textContent=fmt(now);$('clockDate').textContent=now.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});$('clockState').textContent=armed?'ARMED · '+fmt(armed.start):'';$('moon').textContent='☾'}$('hourText').textContent=pad(data.hours);$('minuteText').textContent=pad(data.minutes);const d=finish();$('finishText').textContent='Ends '+fmt(d)+(d.toDateString()!==now.toDateString()?' tomorrow':'');$('nowMask').className='mode-mask now '+(data.mode==='now'?'active':'inactive');$('laterMask').className='mode-mask later '+(data.mode==='later'?'active':'inactive');$('laterMask').textContent=data.mode==='later'?pad(data.startHour)+':'+pad(data.startMinute):'At…';$('scheduleCount').textContent=data.schedules.filter(s=>s.enabled).length+' active';const next=scheduleNext();$('nextTitle').textContent=next?next.s.name:'No schedules';$('nextWhen').textContent=next?(next.d.toDateString()===now.toDateString()?'Today':next.d.toDateString()===new Date(now.getFullYear(),now.getMonth(),now.getDate()+1).toDateString()?'Tomorrow':next.d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}))+' · '+fmt(next.d):'Nothing upcoming';$('nextLength').textContent=next?'For '+durationString(next.s.hours*60+next.s.minutes):'Tap to add one';updateLamps();}
function updateLamps(){const root=$('lamps');root.innerHTML='';['favourites','alarms','music'].forEach((key,i)=>{const positions=[{x:29.8,y:78.1,slashX:12.3},{x:60.6,y:78.1,slashX:43},{x:91.6,y:78.1,slashX:74}];const p=positions[i],l=document.createElement('span');l.className='lamp'+(data.allowed[key]?' on':'');l.style.left=p.x+'%';l.style.top=p.y+'%';root.appendChild(l);if(!data.allowed[key]){let s=document.createElement('span');s.className='offslash';s.style.left=p.slashX+'%';s.style.top='80.6%';root.appendChild(s)}})}function open(html){$('modalLayer').hidden=false;$('modalLayer').innerHTML='<section class="modal" role="dialog" aria-modal="true">'+html+'</section>';$('modalLayer').querySelector('button')?.focus()}function close(){$('modalLayer').hidden=true;$('modalLayer').innerHTML='';render()}$('modalLayer').addEventListener('click',e=>{if(e.target===$('modalLayer'))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});function actionPair(){return '<div class="row" style="justify-content:flex-end;margin-top:4cqw"><button class="pillbtn" data-close>Close</button><button class="pillbtn green" data-save>Save</button></div>'}function roller(id,label,value,max){return '<div class="roller" data-roller="'+id+'" data-max="'+max+'"><button type="button" data-spin="1" aria-label="Increase '+label+'">▲</button><strong>'+pad(value)+'</strong><button type="button" data-spin="-1" aria-label="Decrease '+label+'">▼</button><small>'+label+'</small></div>'}function showDuration(){open('<h2>Quick Timer · Duration</h2><p>Set exactly how long quiet time lasts.</p><div class="wheelrow">'+roller('hours','Hours',data.hours,23)+roller('minutes','Minutes',data.minutes,59)+'</div><div class="message" id="editSummary"></div>'+actionPair());const layer=$('modalLayer');function update(){layer.querySelector('[data-roller="hours"] strong').textContent=pad(data.hours);layer.querySelector('[data-roller="minutes"] strong').textContent=pad(data.minutes);layer.querySelector('#editSummary').textContent='Finishes at '+fmt(finish())}layer.addEventListener('click',function handler(e){const spin=e.target.closest('[data-spin]');if(spin){const r=spin.closest('[data-roller]'),k=r.dataset.roller,max=Number(r.dataset.max);data[k]=(data[k]+Number(spin.dataset.spin)+max+1)%(max+1);save();update()}else if(e.target.closest('[data-save]')){layer.removeEventListener('click',handler);close()}else if(e.target.closest('[data-close]')){layer.removeEventListener('click',handler);close()}});update()}
function showStart(){data.mode='later';save();open('<h2>Start at a time</h2><p>Choose the time of day to start this one-off timer. A time already passed today means tomorrow.</p><div class="wheelrow">'+roller('startHour','Hour',data.startHour,23)+roller('startMinute','Minute',data.startMinute,59)+'</div><div id="editSummary" class="message"></div>'+actionPair());const layer=$('modalLayer');function update(){for(const k of ['startHour','startMinute'])layer.querySelector('[data-roller="'+k+'"] strong').textContent=pad(data[k]);const start=getStart();layer.querySelector('#editSummary').textContent='Start '+start.toLocaleString('en-GB',{weekday:'short',hour:'2-digit',minute:'2-digit'})+' · finish '+fmt(finish());render()}layer.addEventListener('click',function handler(e){let b=e.target.closest('[data-spin]');if(b){let r=b.closest('[data-roller]'),k=r.dataset.roller,max=Number(r.dataset.max);data[k]=(data[k]+Number(b.dataset.spin)+max+1)%(max+1);save();update()}if(e.target.closest('[data-save],[data-close]')){layer.removeEventListener('click',handler);close()}});update()}
function launch(duration,source){if(duration<1){showDuration();return}const start=getStart();if(start.getTime()>Date.now()+1500){armed={start,duration,source};active=null;announce('Timer armed for '+fmt(start))}else{active={start:new Date(),duration,end:new Date(Date.now()+duration*60000),source};armed=null;announce('Timer started')}render()}
function showActive(){if(!active&&!armed)return;let txt=active?'Quiet time running. Ends '+fmt(active.end):'Timer armed for '+fmt(armed.start);open('<h2>Timer status</h2><p>'+txt+'</p><p>Browser demo only: this page does not change Android sound or DND settings.</p><div class="row"><button class="pillbtn" data-close>Keep timer</button><button class="pillbtn green" id="stopTimer">Cancel / Stop</button></div>');$('stopTimer').onclick=()=>{active=null;armed=null;close();announce('Timer stopped')};$('modalLayer').querySelector('[data-close]').onclick=close}
function scheduleNext(){let now=new Date(),all=[];for(const s of data.schedules.filter(s=>s.enabled)){let [h,m]=s.time.split(':').map(Number);for(let i=0;i<8;i++){let d=new Date(now);d.setDate(d.getDate()+i);d.setHours(h,m,0,0);if(d>now&&(!s.days?.length||s.days.includes(d.getDay())))all.push({s,d})}}all.sort((a,b)=>a.d-b.d);return all[0]||null}
function showScheduleList(){let items=data.schedules.map((s,i)=>'<div class="schedule-item"><strong>'+escapeHtml(s.name)+'</strong> · '+s.time+' · '+durationString(s.hours*60+s.minutes)+'<br><span class="small">'+(s.days.length?s.days.map(d=>['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d]).join(', '):'One-off next occurrence')+' · '+(s.enabled?'Enabled':'Paused')+'</span><div class="row"><button class="pillbtn" data-toggle-schedule="'+i+'">'+(s.enabled?'Pause':'Enable')+'</button><button class="pillbtn" data-edit-schedule="'+i+'">Edit</button><button class="pillbtn" data-delete-schedule="'+i+'">Delete</button></div></div>').join('');open('<h2>Manage Schedules</h2><p>Automatic schedules are independent of your Quick Presets.</p>'+(items||'<p>No schedules yet.</p>')+'<div class="row"><button class="pillbtn" data-close>Back</button><button class="pillbtn green" data-new-schedule>Add schedule</button></div>');const layer=$('modalLayer');layer.querySelector('[data-close]').onclick=close;layer.querySelector('[data-new-schedule]').onclick=()=>editSchedule(-1);layer.querySelectorAll('[data-toggle-schedule]').forEach(b=>b.onclick=()=>{let x=data.schedules[+b.dataset.toggleSchedule];x.enabled=!x.enabled;save();showScheduleList()});layer.querySelectorAll('[data-delete-schedule]').forEach(b=>b.onclick=()=>{data.schedules.splice(+b.dataset.deleteSchedule,1);save();showScheduleList()});layer.querySelectorAll('[data-edit-schedule]').forEach(b=>b.onclick=()=>editSchedule(+b.dataset.editSchedule))}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function editSchedule(i){const isNew=i<0,s=isNew?{name:'New quiet time',time:'13:00',hours:0,minutes:45,days:[],allowed:{...data.allowed},enabled:true}:JSON.parse(JSON.stringify(data.schedules[i]));open('<h2>'+(isNew?'New schedule':'Edit schedule')+'</h2><div class="row"><label class="small" for="schName">Name</label><input id="schName" class="field" value="'+escapeHtml(s.name)+'"></div><div class="row" style="margin-top:3cqw"><label class="small">Starts</label><input id="schTime" class="field" type="time" value="'+s.time+'"></div><div class="row" style="margin-top:3cqw"><label class="small">Hours</label><input id="schH" class="field" type="number" min="0" max="23" value="'+s.hours+'"><label class="small">Minutes</label><input id="schM" class="field" type="number" min="0" max="59" value="'+s.minutes+'"></div><h3>Repeat days (none = once)</h3><div class="days">'+['S','M','T','W','T','F','S'].map((n,d)=>'<label><input type="checkbox" data-day="'+d+'" '+(s.days.includes(d)?'checked':'')+'>'+n+'</label>').join('')+'</div><h3>Allow through</h3><div class="row">'+['favourites','alarms','music'].map(k=>'<label class="small"><input data-allowed="'+k+'" type="checkbox" '+(s.allowed[k]?'checked':'')+'>'+k[0].toUpperCase()+k.slice(1)+'</label>').join('')+'</div><p class="small">This browser preview schedules alerts only while open. Android integration is required to silence the phone in the background.</p><div class="row"><button class="pillbtn" id="cancelSchedule">Cancel</button><button class="pillbtn green" id="saveSchedule">Save schedule</button></div>');$('cancelSchedule').onclick=showScheduleList;$('saveSchedule').onclick=()=>{let name=$('schName').value.trim()||'Quiet time',time=$('schTime').value,h=Math.max(0,Math.min(23,Number($('schH').value)||0)),m=Math.max(0,Math.min(59,Number($('schM').value)||0));if(!time||h+m===0){alert('Choose a time and a duration');return}s.name=name;s.time=time;s.hours=h;s.minutes=m;s.days=[...$('modalLayer').querySelectorAll('[data-day]:checked')].map(x=>Number(x.dataset.day));s.allowed={};$('modalLayer').querySelectorAll('[data-allowed]').forEach(x=>s.allowed[x.dataset.allowed]=x.checked);if(isNew){s.id=Date.now();data.schedules.push(s)}else data.schedules[i]=s;save();showScheduleList();render()}}
function showSettings(){open('<h2>KipQuiet demo</h2><p>This is an interactive design preview of the quieter moonlit layout. The green ring counts down while running, the presets start sample durations, and the 3D LED buttons switch allowed interruptions on and off.</p><p>Important: a web page cannot change Android Do Not Disturb, silence calls, or reliably run automatic schedules in the background.</p><button class="pillbtn" data-close>Close</button>');$('modalLayer').querySelector('[data-close]').onclick=close}
function tickSchedule(){const now=new Date();for(const s of data.schedules.filter(x=>x.enabled)){let [h,m]=s.time.split(':').map(Number);if(now.getHours()===h&&now.getMinutes()===m&&now.getSeconds()===0&&!active&&!armed){active={start:now,end:new Date(now.getTime()+(s.hours*60+s.minutes)*60000),duration:s.hours*60+s.minutes,source:s.name};announce('Scheduled timer started: '+s.name);if(!s.days.length)s.enabled=false;save();break}}}
const bind=(id,fn)=>$(id).addEventListener('click',fn);document.querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click',()=>{if(active||armed){showActive();return}launch(data.presets[+b.dataset.preset].minutes,data.presets[+b.dataset.preset].name)}));document.querySelectorAll('[data-allow]').forEach(b=>b.addEventListener('click',()=>{let k=b.dataset.allow;data.allowed[k]=!data.allowed[k];save();render();announce(k+' '+(data.allowed[k]?'allowed':'blocked'))}));bind('nowButton',()=>{data.mode='now';save();render()});bind('laterButton',showStart);bind('hoursUp',()=>shift('hours',1,23));bind('hoursDown',()=>shift('hours',-1,23));bind('minutesUp',()=>shift('minutes',1,59));bind('minutesDown',()=>shift('minutes',-1,59));function shift(k,step,max){data[k]=(data[k]+step+max+1)%(max+1);save();render()}bind('hoursEdit',showDuration);bind('minutesEdit',showDuration);bind('startButton',()=>{if(active||armed)showActive();else launch(total(),'Quick Timer')});bind('scheduleButton',showScheduleList);bind('nextButton',()=>{const n=scheduleNext();if(n)open('<h2>Next schedule</h2><p>'+escapeHtml(n.s.name)+'<br>'+n.d.toLocaleString('en-GB',{weekday:'long',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+'<br>Runs for '+durationString(n.s.hours*60+n.s.minutes)+'</p><button class="pillbtn" id="goManage">Manage schedules</button>');else open('<h2>Next schedule</h2><p>No automatic schedules enabled.</p><button class="pillbtn" id="goManage">Manage schedules</button>');$('goManage').onclick=showScheduleList});bind('settingsButton',showSettings);
// Touch wheel gestures on the illustrated duration rollers.
for(const [id,key,max] of [['hoursEdit','hours',23],['minutesEdit','minutes',59]]){let startY=null;const el=$(id);el.addEventListener('touchstart',e=>{startY=e.touches[0].clientY},{passive:true});el.addEventListener('touchend',e=>{if(startY===null)return;const d=e.changedTouches[0].clientY-startY;startY=null;if(Math.abs(d)>16){e.preventDefault();shift(key,d<0?1:-1,max)}},{passive:false})}
render();setInterval(()=>{tickSchedule();render()},1000);
})();</script></body></html>
