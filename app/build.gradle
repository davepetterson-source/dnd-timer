plugins {
    id 'com.android.application'
}

android {
    namespace 'com.catstorm.dndtimer'
    compileSdk 34

    defaultConfig {
        applicationId 'com.catstorm.dndtimer'
        minSdk 28
        targetSdk 34
        versionCode = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '1.0'
    }

    // Fixed signing key so every build installs as an update over the last one.
    signingConfigs {
        kipquiet {
            storeFile file('kipquiet.keystore')
            storePassword 'kipquiet'
            keyAlias 'kipquiet'
            keyPassword 'kipquiet'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.kipquiet }
        release { signingConfig signingConfigs.kipquiet }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
