<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>KipQuiet C59 — Round Clock & Preset Editor</title><style>
*{box-sizing:border-box}html{background:#020817}body{margin:0;display:flex;justify-content:center;min-height:100vh;background:radial-gradient(ellipse at top,#0b1a42,#020615);font:15px Arial,sans-serif;color:white}button,input{font:inherit}button{color:white;cursor:pointer}#phone{width:min(100%,430px);position:relative;line-height:1;overflow:hidden;align-self:flex-start;box-shadow:0 0 32px #0009;container-type:inline-size}#art{width:100%;display:block;height:auto;pointer-events:none}#live{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.hit{position:absolute;border:0;background:transparent;touch-action:manipulation;z-index:3;border-radius:12px}.hit:focus-visible{outline:2px solid white;outline-offset:2px}.hit:active{background:#ffffff19}.presets{position:absolute;left:14.9%;top:33.35%;width:68.3%;height:12.0%;display:grid;grid-template-columns:repeat(4,1fr);gap:1.2%;z-index:2}.presets button{border:0;background:transparent;border-radius:15px;cursor:pointer}.presets button:focus-visible{outline:2px solid white}.tap-area{position:absolute;z-index:2;border:0;background:transparent;cursor:pointer;border-radius:15px}.tap-area:focus-visible{outline:2px solid #fff}.cover{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000c;padding:16px;z-index:40}.dialog{width:min(410px,100%);max-height:88vh;overflow:auto;padding:20px;border:1px solid #a2dbff;border-radius:22px;background:linear-gradient(145deg,#41649c,#07183a 19%,#0b1230 82%,#365c94);box-shadow:0 16px 36px #000,inset 0 2px 3px #effbff8c}.dialog h2{margin:0 0 16px;font-size:21px}.dialog p{line-height:1.4;color:#c8daf8}.dialog label{display:block;color:#d0e5ff;margin:12px 0 6px}.dialog input[type=text],.dialog input[type=number],.dialog input[type=time],.dialog select{width:100%;color:#fff;background:#112b54;border:1px solid #769dca;border-radius:10px;padding:11px}.dialog button{border-radius:11px;border:1px solid #94c8fb;background:linear-gradient(#4d8bce,#18376e);padding:11px}.dialog .row{display:flex;gap:9px;margin-top:15px}.dialog .row>*{flex:1}.days{display:flex;gap:5px;flex-wrap:wrap}.days label{margin:0;background:#183a66;border-radius:8px;padding:8px 5px;display:flex;align-items:center;gap:2px;flex:1}.entry{padding:13px 0;border-bottom:1px solid #7799bb;display:flex;justify-content:space-between;gap:8px}.entry small{display:block;margin-top:5px;color:#b8d0f1}.entry button{padding:8px}.wheels{display:flex;gap:15px;justify-content:center}.wheel{flex:1;max-width:125px;border-radius:16px;border:1px solid #91c3f0;background:linear-gradient(#345585,#0a1d3b 30%,#486da1 51%,#07152f 75%,#274575);display:flex;flex-direction:column;align-items:center;touch-action:none}.wheel button{background:transparent;border:0;font-size:22px;width:100%;padding:8px}.wheel b{font-size:25px;padding:11px;color:#fff;text-shadow:0 0 8px #8ac8ff}.wheel small{color:#c6daff;padding:7px}#info{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);max-width:90%;background:#102d55d9;border:1px solid #80c7fd;border-radius:12px;padding:8px 14px;font-size:13px;z-index:15;text-align:center;display:none}

.editor-gear{display:flex;align-items:center;justify-content:center;font-size:23px;color:#c7e4ff;text-shadow:0 0 6px #a1cfff;box-shadow:0 0 8px #2158a7;border:1px solid #5d91e3!important;border-radius:100%!important;background:#0a1f48aa!important}
/* C58: preset editor, matching translucent sapphire family theme */
.dialog{width:min(440px,100%);max-height:91dvh;padding:17px;border-radius:22px;background:linear-gradient(143deg,#406aaf 0%,#142f63 8%,#081531 38%,#07102a 81%,#3763a0 100%);box-shadow:0 22px 60px #000d,inset 0 2px 2px #edfaff8c}
.editor-heading{font-weight:750;font-size:22px;text-align:center;margin-bottom:4px;text-shadow:0 0 10px #70aeef66}
.editor-kicker{text-align:center;color:#adc7e8;font-size:12px;margin-bottom:12px}
.icon-picker-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:12px 3px}
.icon-choice{position:relative!important;min-width:0;aspect-ratio:1/1.05;border-radius:15px!important;padding:6px 2px 5px!important;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:1px solid #70a5ec8a!important;background:linear-gradient(145deg,#5479bd 0%,#1a386f 23%,#091c47 70%,#2a4f8b 100%)!important;box-shadow:inset 0 2px 2px #c4e8ff4f,inset 0 -2px 5px #010a2899,0 3px 7px #0008!important}
.icon-choice.selected{border:2px solid #bce7ff!important;background:linear-gradient(150deg,#4a90e0,#123870 54%,#264e95)!important;box-shadow:0 0 13px #53bdffb5,inset 0 2px 3px #e0faff88!important}
.icon-choice img{height:47px;width:47px;max-width:85%;object-fit:contain;filter:drop-shadow(0 0 3px #b5e2ff55)}
.icon-choice span{font-size:10px;color:#e6f3ff;line-height:1.1;white-space:nowrap}
.icon-choice.selected:after{content:'✓';position:absolute;top:2px;right:5px;color:#77ffa7;font-weight:800;font-size:13px}
.editor-preview{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px 0 14px;padding:13px;border-radius:17px;border:1px solid #77b4ff;background:linear-gradient(140deg,#2d5f9a,#0a224e 40%,#0b1431 80%,#1d427b);box-shadow:inset 0 2px 4px #bddfff72,0 4px 14px #0007}
.editor-preview img{height:63px;width:63px;object-fit:contain}
.editor-preview .preview-title{font-weight:750;font-size:18px;line-height:1.3}.editor-preview .preview-meta{color:#bfdef8;font-size:13px;margin-top:4px}
.editor-controls{display:grid;grid-template-columns:minmax(0,1fr) 90px 90px;gap:8px;align-items:end}
.editor-controls label{font-size:12px;margin:0 0 3px}.editor-controls input{min-width:0;padding:9px!important}
.pass-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:8px 0 0}
.pass-btn{padding:10px 2px!important;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;border-radius:13px!important;font-size:11px;border:1px solid #476497!important;background:linear-gradient(#253956,#101b34)!important;box-shadow:inset 0 2px 4px #accfff39,0 4px 7px #0005!important}
.pass-btn.on{background:linear-gradient(#347fce,#0c3d83 65%,#112e69)!important;border-color:#8bcaff!important;box-shadow:inset 0 2px 5px #d2f8ff75,0 0 11px #319cff8f!important}
.pass-btn .led{display:inline-block;width:9px;height:9px;border-radius:50%;background:#454f64;box-shadow:inset 0 0 3px #000}
.pass-btn.on .led{background:#59ff89;box-shadow:0 0 7px #3dfc78}
.editor-actions button{font-weight:700}.editor-actions .save{background:linear-gradient(#76f1a0,#168446 70%,#07642d)!important;border-color:#b0ffd0!important}
.editor-list .entry{align-items:center}.editor-list img{height:40px;width:40px;object-fit:contain;flex-shrink:0}.editor-list .item-copy{flex:1}
.editor-banner{padding:10px 12px;border:1px solid #527fa9;border-radius:12px;background:#0d264b;font-size:12px;color:#c9dff7;line-height:1.4}
/* The saved custom icon uses a small badge on top of the unchanged original preset artwork. */
.preset-saved-icon{position:absolute;z-index:2;width:5.7%;aspect-ratio:1;pointer-events:none;object-fit:contain;filter:drop-shadow(0 0 5px #ecf8ffaa);display:none}

<script>
(()=>{'use strict';const W=1122,H=1402,$=id=>document.getElementById(id),ctx=$('live').getContext('2d'),pad=n=>String(n).padStart(2,'0');const names=['Meditation','Nap','Meeting','Sleep'],durations=[15,30,60,480];const key='kipquiet-c56-schedules';
const state={hours:0,minutes:45,at:null,end:0,total:0,armed:null,allow:{fav:false,alarms:true,music:false},schedules:[],fired:{}};
try{state.schedules=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(state.schedules))state.schedules=[]}catch{state.schedules=[]}
function save(){try{localStorage.setItem(key,JSON.stringify(state.schedules))}catch{}}
function toast(s){const t=$('info');t.textContent=s;t.style.display='block';setTimeout(()=>{if(t.textContent===s)t.style.display='none'},2400)}
function ellipse(x,y,rx,ry){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2)}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function overlayPill(x,y,w,h,top,bottom){rrect(x,y,w,h,18);const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,top);g.addColorStop(1,bottom);ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#80bced9a';ctx.lineWidth=1.4;ctx.stroke()}
function text(str,x,y,size,weight=600,color='#f7fbff'){ctx.save();ctx.fillStyle=color;ctx.font=`${weight} ${size}px Arial,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(str,x,y);ctx.restore()}
function startDate(){const d=new Date();if(state.at){d.setHours(state.at.h,state.at.m,0,0);if(d.getTime()<=Date.now())d.setDate(d.getDate()+1)}return d}
function draw(){const d=new Date(),active=state.end&&state.end>Date.now(),left=Math.max(0,state.end-Date.now());ctx.clearRect(0,0,W,H);
// Preserve the original round segmented clock artwork and cover ONLY its baked-in HH:MM numerals.
const gx=ctx.createRadialGradient(548,269,15,548,269,115);gx.addColorStop(0,'#030e2a');gx.addColorStop(.8,'#02122f');gx.addColorStop(1,'#02122f');ctx.save();ctx.fillStyle=gx;ctx.beginPath();ctx.roundRect(467,235,167,68,17);ctx.fill();ctx.restore();
const clockValue=active?`${pad(Math.floor(left/3600000))}:${pad(Math.floor(left/60000)%60)}`:`${pad(d.getHours())}:${pad(d.getMinutes())}`;
ctx.save();ctx.font='650 60px Arial,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#f4f7fd';ctx.shadowBlur=5;ctx.shadowColor='#7fbcff';ctx.fillText(clockValue,549,270);ctx.restore();
// Subtle seconds marker over the existing 60-segment clock, or countdown progress.
let i=active?Math.floor((1-left/(state.total*60000))*60)%60:d.getSeconds();let angle=-Math.PI/2+i*Math.PI*2/60;
ctx.save();ctx.strokeStyle='#e4f5ff';ctx.lineWidth=4;ctx.shadowColor='#8fdfff';ctx.shadowBlur=10;ctx.beginPath();ctx.arc(549,259,111,angle-.029,angle+.029);ctx.stroke();ctx.restore();
// Live duration and finishing time sit over the artwork's painted numerals.
overlayPill(236,853,130,49,'#254a82','#08224d');text(`${pad(state.hours)} h`,301,879,37,700);
overlayPill(391,853,137,49,'#254a82','#08224d');text(`${pad(state.minutes)} m`,459,879,37,700);
const finish=new Date();finish.setMinutes(finish.getMinutes()+state.hours*60+state.minutes);
overlayPill(660,851,215,53,'#254a82','#08224d');text(finish.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),767,878,39,700);
const nxt=findNext(); // redraw schedule text inside the existing left card, but keep the card style unchanged.
ctx.fillStyle='#111f4a';ctx.beginPath();ctx.roundRect(205,288,191,45,9);ctx.fill();text(nxt?`${pad(nxt.h)}:${pad(nxt.m)} · ${nxt.days.length?'repeat':'once'}`:'No schedules',300,308,20,500);
// Live LEDs. The original glossy button artwork remains untouched.
for(const [k,x] of [['fav',397],['alarms',640],['music',891]]){ctx.save();ctx.beginPath();ctx.roundRect(x-12,1032,25,27,6);ctx.fillStyle=state.allow[k]?'#25bc62':'#394668';ctx.fill();ctx.restore()}
if(state.end){overlayPill(285,1114,532,62,'#25865f','#06422a');text('■ Stop Sleep Timer',549,1146,37,700)}
if(state.end&&Date.now()>=state.end){state.end=0;state.total=0;toast('Timer finished')}
}
function upcoming(s,now=Date.now()){let dt=new Date(now);dt.setHours(s.h,s.m,0,0);for(let i=0;i<8;i++){let x=new Date(dt);x.setDate(dt.getDate()+i);if(x.getTime()<=now+100)returnLoop: {continue};if(s.days.length&&!s.days.includes(x.getDay()))continue;if(!s.days.length&&s.done)return Infinity;return x.getTime()}return Infinity}
function findNext(){const arr=state.schedules.filter(s=>s.enabled!==false).map(s=>({...s,next:upcoming(s)})).filter(s=>Number.isFinite(s.next)).sort((a,b)=>a.next-b.next);return arr[0]||null}
function begin(min){if(!min)return toast('Choose a duration');state.end=Date.now()+min*60000;state.total=min;state.armed=null;draw()}
for(const b of document.querySelectorAll('[data-p]'))b.onclick=()=>{state.at=null;begin(durations[+b.dataset.p]);toast(names[+b.dataset.p]+' started')};
for(const b of document.querySelectorAll('[data-a]'))b.onclick=()=>{const k=b.dataset.a;state.allow[k]=!state.allow[k];draw();toast((k==='fav'?'Favourites':k==='alarms'?'Alarms':'Music')+(state.allow[k]?' allowed':' blocked'))};
$('now').onclick=()=>{state.at=null;draw();toast('Starts now')};function updateDuration(k,v){if(k==='h')state.hours=(state.hours+v+24)%24;else state.minutes=(state.minutes+v+60)%60;draw()}
for(const id of ['hup','hdown','mup','mdown'])$(id).onclick=()=>updateDuration(id[0],id.endsWith('up')?1:-1);
for(const id of ['hval','mval']){let y=null;const k=id[0];$(id).addEventListener('touchstart',e=>{y=e.touches[0].clientY},{passive:true});$(id).addEventListener('touchend',e=>{const delta=y-e.changedTouches[0].clientY;if(Math.abs(delta)>8)updateDuration(k,delta>0?1:-1)});$(id).onclick=()=>updateDuration(k,1);$(id).addEventListener('wheel',e=>{e.preventDefault();updateDuration(k,e.deltaY<0?1:-1)},{passive:false})}
function close(){$('modals').innerHTML=''}function modal(body){$('modals').innerHTML='<div class="cover"><section class="dialog" role="dialog" aria-modal="true">'+body+'</section></div>';document.querySelector('.cover').addEventListener('click',e=>{if(e.target.classList.contains('cover'))close()})}
$('later').onclick=()=>{let h=state.at?.h??13,m=state.at?.m??0;modal(`<h2>Start at a time</h2><p>Set the clock time for this one-off timer.</p><div class="wheels"><div class="wheel"><button id="hu">▲</button><b id="hh">${pad(h)}</b><button id="hd">▼</button><small>Hours</small></div><div class="wheel"><button id="mu">▲</button><b id="mm">${pad(m)}</b><button id="md">▼</button><small>Minutes</small></div></div><div class="row"><button id="cancel">Cancel</button><button id="set">Set time</button></div><p>If the time has passed today, the timer will start tomorrow.</p>`);$('hu').onclick=()=>{h=(h+1)%24;$('hh').textContent=pad(h)};$('hd').onclick=()=>{h=(h+23)%24;$('hh').textContent=pad(h)};$('mu').onclick=()=>{m=(m+1)%60;$('mm').textContent=pad(m)};$('md').onclick=()=>{m=(m+59)%60;$('mm').textContent=pad(m)};$('cancel').onclick=close;$('set').onclick=()=>{state.at={h,m};close();draw()}};
$('start').onclick=()=>{if(state.end){state.end=0;state.armed=null;toast('Timer stopped')}else if(state.armed){state.armed=null;toast('Scheduled timer cancelled')}else{const minutes=state.hours*60+state.minutes;if(!minutes)return toast('Choose a duration');if(state.at){state.armed={when:startDate().getTime(),minutes};toast('Timer set for '+pad(state.at.h)+':'+pad(state.at.m))}else begin(minutes)}draw()};
const namesDays=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],daysShort=['S','M','T','W','T','F','S'];function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function manage(){modal(`<h2>Manage Schedules</h2>${state.schedules.map((s,i)=>`<div class="entry"><div><strong>${esc(s.name)}</strong><small>${pad(s.h)}:${pad(s.m)} · ${s.duration}m · ${s.days.length?s.days.map(d=>namesDays[d]).join(', '):'Once'}${s.enabled===false?' · Paused':''}</small></div><button data-edit="${i}">Edit</button></div>`).join('')||'<p>No schedules yet.</p>'}<div class="row"><button id="close">Close</button><button id="add">+ Add Schedule</button></div><p>Repeat days remain saved after each run. Browser schedules require this page to stay open.</p>`);$('close').onclick=close;$('add').onclick=()=>edit(-1);document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(+b.dataset.edit))}
function edit(i){const s=i>=0?state.schedules[i]:{name:'Quiet Time',h:23,m:0,duration:45,days:[],enabled:true};modal(`<h2>${i<0?'Add':'Edit'} Schedule</h2><label>Name</label><input id="name" type="text" value="${esc(s.name)}" maxlength="32"><label>Starts at</label><input id="time" type="time" value="${pad(s.h)}:${pad(s.m)}"><label>Runs for (minutes)</label><input id="duration" type="number" min="1" max="1440" value="${s.duration}"><label>Repeat days (leave blank for once)</label><div class="days">${daysShort.map((v,j)=>`<label><input type="checkbox" data-day="${j}" ${s.days.includes(j)?'checked':''}>${v}</label>`).join('')}</div><label><input id="enabled" type="checkbox" ${s.enabled!==false?'checked':''}> Enabled</label><div class="row"><button id="back">Back</button>${i>=0?'<button id="delete">Delete</button>':''}<button id="save">Save</button></div>`);$('back').onclick=manage;if(i>=0)$('delete').onclick=()=>{state.schedules.splice(i,1);save();manage()};$('save').onclick=()=>{const time=$('time').value.split(':').map(Number),duration=+$('duration').value;if(time.length<2||!Number.isFinite(duration)||duration<1){toast('Enter a valid time and duration');return}const item={name:$('name').value.trim()||'Quiet Time',h:time[0],m:time[1],duration:Math.min(1440,Math.floor(duration)),days:[...document.querySelectorAll('[data-day]:checked')].map(e=>+e.dataset.day),enabled:$('enabled').checked,done:false};if(i<0)state.schedules.push(item);else state.schedules[i]=item;save();draw();manage()}}
$('next').onclick=manage;$('manage').onclick=manage;$('settings').onclick=()=>modal('<h2>KipQuiet preview</h2><p>Quick Presets start immediately. Choose a specific time for a one-off timer, or use Manage Schedules for automatic repeat days.</p><p>This standalone browser prototype cannot control Android sound settings or run scheduled timers when closed.</p><div class="row"><button id="ok">Close</button></div>');
function check(){const now=Date.now();if(state.armed&&now>=state.armed.when)begin(state.armed.minutes);const d=new Date(),day=d.getDay();for(const s of state.schedules){if(!s.enabled||!s.days.length&&s.done)continue;const last=d.toLocaleDateString('en-CA')+':'+s.h+':'+s.m;if(d.getHours()===s.h&&d.getMinutes()===s.m&&s.last!==last&&(!s.days.length||s.days.includes(day))){s.last=last;if(!s.days.length)s.done=true;begin(s.duration);save()}}}

const iconLabels={meditate:'Meditation',nap:'Bed',meeting:'Meeting',moon:'Moon',book:'Book',tea:'Break',spanner:'Spanner',screwdriver:'Screwdriver',crossed:'Crossed tools',briefcase:'Work',car:'Travel',star:'Other'};
const presetColors=['#8e42ef','#188bfa','#f8a309','#0fcbb2'];
const pkey='kipquiet-preset-editor-c59';
const defaults=[{name:'Meditation',minutes:15,icon:'meditate',allow:{fav:false,alarms:false,music:false}},{name:'Nap',minutes:30,icon:'nap',allow:{fav:false,alarms:true,music:true}},{name:'Meeting',minutes:60,icon:'meeting',allow:{fav:true,alarms:true,music:false}},{name:'Sleep',minutes:480,icon:'moon',allow:{fav:false,alarms:true,music:true}}];
let presetDefs=defaults.map(x=>({...x,allow:{...x.allow}}));
try{const fromStore=JSON.parse(localStorage.getItem(pkey)||'null');if(Array.isArray(fromStore)&&fromStore.length===4)presetDefs=fromStore.map((x,i)=>({...defaults[i],...x,allow:{...defaults[i].allow,...x.allow}}))}catch{}
function persistPresets(){try{localStorage.setItem(pkey,JSON.stringify(presetDefs))}catch{}}
function previewCard(i){const item=presetDefs[i];return `<img src="${presetIconAssets[item.icon]||presetIconAssets.star}" alt=""><div class="item-copy"><strong>${esc(item.name)}</strong><small>${item.minutes>=60?Math.floor(item.minutes/60)+'h '+(item.minutes%60?item.minutes%60+'m':''):item.minutes+'m'} · ${['fav','alarms','music'].filter(k=>item.allow[k]).map(k=>k==='fav'?'Favourites':k==='alarms'?'Alarms':'Music').join(' + ')||'No interruptions'}</small></div>`}
function presetManager(){modal(`<div class="editor-heading">Quick Presets</div><div class="editor-kicker">Choose a preset to customise</div><div class="editor-list">${presetDefs.map((p,i)=>`<div class="entry">${previewCard(i)}<button data-pedit="${i}" aria-label="Edit ${esc(p.name)}">Edit</button></div>`).join('')}</div><div class="editor-banner">Tap a preset on the home screen to start immediately. Edit its name, duration, icon, and allowed interruptions here.</div><div class="row"><button id="pclose">Back to home</button></div>`);document.querySelectorAll('[data-pedit]').forEach(el=>el.onclick=()=>presetEditor(+el.dataset.pedit));$('pclose').onclick=close}
function presetEditor(i){const p=structuredClone(presetDefs[i]);let choice=p.icon;let fav=!!p.allow.fav,alarms=!!p.allow.alarms,music=!!p.allow.music;
  modal(`<div class="editor-heading">Edit Preset</div><div class="editor-kicker">${esc(p.name)} · choose your icon</div><div class="editor-preview" id="epreview"><img id="preview-icon" src="${presetIconAssets[choice]}"><div><div class="preview-title" id="preview-name">${esc(p.name)}</div><div class="preview-meta" id="preview-duration">${p.minutes} minutes</div></div></div><div class="icon-picker-grid">${Object.keys(presetIconAssets).map(k=>`<button class="icon-choice ${k===choice?'selected':''}" type="button" data-picon="${k}" aria-label="${iconLabels[k]} icon" aria-pressed="${k===choice}"><img src="${presetIconAssets[k]}" alt=""><span>${iconLabels[k]}</span></button>`).join('')}</div><div class="editor-controls"><div><label for="pname">Name</label><input id="pname" type="text" maxlength="18" value="${esc(p.name)}"></div><div><label for="phours">Hours</label><input id="phours" type="number" min="0" max="23" value="${Math.floor(p.minutes/60)}"></div><div><label for="pmins">Minutes</label><input id="pmins" type="number" min="0" max="59" value="${p.minutes%60}"></div></div><label>Allow through during this preset</label><div class="pass-row">${[['fav','☎','Favourites'],['alarms','⏰','Alarms'],['music','♫','Music']].map(([k,g,l])=>`<button class="pass-btn ${p.allow[k]?'on':''}" data-ptoggle="${k}" type="button"><span style="font-size:22px">${g}</span><span>${l} <span class="led"></span></span></button>`).join('')}</div><div class="row editor-actions"><button id="pback">Cancel</button><button class="save" id="psave">Save Preset</button></div>`);
function refresh(){ $('preview-icon').src=presetIconAssets[choice];$('preview-name').textContent=$('pname').value||'Preset';$('preview-duration').textContent=((+$('phours').value||0)*60+(+$('pmins').value||0))+' minutes';document.querySelectorAll('[data-picon]').forEach(el=>{el.classList.toggle('selected',el.dataset.picon===choice);el.setAttribute('aria-pressed',String(el.dataset.picon===choice))})}
document.querySelectorAll('[data-picon]').forEach(el=>el.onclick=()=>{choice=el.dataset.picon;refresh()});
for(const id of ['pname','phours','pmins'])$(id).oninput=refresh;
document.querySelectorAll('[data-ptoggle]').forEach(el=>el.onclick=()=>{const k=el.dataset.ptoggle;if(k==='fav')fav=!fav;if(k==='alarms')alarms=!alarms;if(k==='music')music=!music;el.classList.toggle('on',{fav,alarms,music}[k])});
$('pback').onclick=presetManager;
$('psave').onclick=()=>{let total=Math.max(0,Math.min(23,+$('phours').value||0))*60+Math.max(0,Math.min(59,+$('pmins').value||0));if(total<1){toast('Set a duration of at least one minute');return}presetDefs[i]={name:$('pname').value.trim()||p.name,minutes:total,icon:choice,allow:{fav,alarms,music}};persistPresets();refreshPresetBadges();toast('Preset saved');presetManager();};
}
// The approved image is a single raster illustration. Keep it intact; expose edited icon in a small, non-overlapping badge.
function refreshPresetBadges(){ for(let i=0;i<4;i++){const im=$('pbadge'+i);const p=presetDefs[i];if(p.icon!==defaults[i].icon){im.src=presetIconAssets[p.icon];im.style.display='block'}else im.style.display='none'}}
for(let i=0;i<4;i++){const img=document.createElement('img');img.id='pbadge'+i;img.className='preset-saved-icon';img.alt='Selected preset icon';img.style.top='35.1%';img.style.left=(20.6+17.3*i)+'%';$('phone').appendChild(img)}
refreshPresetBadges();
for(const b of document.querySelectorAll('[data-p]'))b.onclick=()=>{let p=presetDefs[+b.dataset.p];state.at=null;state.allow={...p.allow};begin(p.minutes);toast(p.name+' started')};
// Gear opens the real preset configuration menu rather than an informational popup.
$('settings').onclick=()=>presetManager();
// Long press on a preset opens its editor; short tap still starts immediately.
for(const b of document.querySelectorAll('[data-p]')){let timer=null,held=false;const i=+b.dataset.p;b.addEventListener('contextmenu',e=>{e.preventDefault();presetEditor(i)});b.addEventListener('pointerdown',()=>{held=false;timer=setTimeout(()=>{held=true;presetEditor(i)},650)});for(const ev of ['pointerup','pointerleave','pointercancel'])b.addEventListener(ev,()=>clearTimeout(timer));b.addEventListener('click',e=>{if(held){e.stopImmediatePropagation();held=false}},true)}

setInterval(()=>{check();draw()},250);draw();
})();
</script></body></html>
