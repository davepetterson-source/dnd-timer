<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>KipQuiet C58 — Preset Icon Gallery</title><style>
*{box-sizing:border-box}html{background:#020817}body{margin:0;display:flex;justify-content:center;min-height:100vh;background:radial-gradient(ellipse at top,#0b1a42,#020615);font:15px Arial,sans-serif;color:white}button,input{font:inherit}button{color:white;cursor:pointer}#phone{width:min(100%,430px);position:relative;line-height:1;overflow:hidden;align-self:flex-start;box-shadow:0 0 32px #0009;container-type:inline-size}#art{width:100%;display:block;height:auto;pointer-events:none}#live{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.hit{position:absolute;border:0;background:transparent;touch-action:manipulation;z-index:3;border-radius:12px}.hit:focus-visible{outline:2px solid white;outline-offset:2px}.hit:active{background:#ffffff19}.presets{position:absolute;left:3%;top:23.3%;width:94%;height:14.4%;display:grid;grid-template-columns:repeat(4,1fr);gap:1.2%;z-index:2}.presets button{border:0;background:transparent;border-radius:15px;cursor:pointer}.presets button:focus-visible{outline:2px solid white}.tap-area{position:absolute;z-index:2;border:0;background:transparent;cursor:pointer;border-radius:15px}.tap-area:focus-visible{outline:2px solid #fff}.cover{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000c;padding:16px;z-index:40}.dialog{width:min(410px,100%);max-height:88vh;overflow:auto;padding:20px;border:1px solid #a2dbff;border-radius:22px;background:linear-gradient(145deg,#41649c,#07183a 19%,#0b1230 82%,#365c94);box-shadow:0 16px 36px #000,inset 0 2px 3px #effbff8c}.dialog h2{margin:0 0 16px;font-size:21px}.dialog p{line-height:1.4;color:#c8daf8}.dialog label{display:block;color:#d0e5ff;margin:12px 0 6px}.dialog input[type=text],.dialog input[type=number],.dialog input[type=time],.dialog select{width:100%;color:#fff;background:#112b54;border:1px solid #769dca;border-radius:10px;padding:11px}.dialog button{border-radius:11px;border:1px solid #94c8fb;background:linear-gradient(#4d8bce,#18376e);padding:11px}.dialog .row{display:flex;gap:9px;margin-top:15px}.dialog .row>*{flex:1}.days{display:flex;gap:5px;flex-wrap:wrap}.days label{margin:0;background:#183a66;border-radius:8px;padding:8px 5px;display:flex;align-items:center;gap:2px;flex:1}.entry{padding:13px 0;border-bottom:1px solid #7799bb;display:flex;justify-content:space-between;gap:8px}.entry small{display:block;margin-top:5px;color:#b8d0f1}.entry button{padding:8px}.wheels{display:flex;gap:15px;justify-content:center}.wheel{flex:1;max-width:125px;border-radius:16px;border:1px solid #91c3f0;background:linear-gradient(#345585,#0a1d3b 30%,#486da1 51%,#07152f 75%,#274575);display:flex;flex-direction:column;align-items:center;touch-action:none}.wheel button{background:transparent;border:0;font-size:22px;width:100%;padding:8px}.wheel b{font-size:25px;padding:11px;color:#fff;text-shadow:0 0 8px #8ac8ff}.wheel small{color:#c6daff;padding:7px}#info{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);max-width:90%;background:#102d55d9;border:1px solid #80c7fd;border-radius:12px;padding:8px 14px;font-size:13px;z-index:15;text-align:center;display:none}

/* C58: preset editor, matching translucent sapphire family theme */
.dialog{width:min(440px,100%);max-height:91dvh;padding:17px;border-radius:22px;background:linear-gradient(143deg,#406aaf 0%,#142f63 8%,#081531 38%,#07102a 81%,#3763a0 100%);box-shadow:0 22px 60px #000d,inset 0 2px 2px #edfaff8c}
.editor-heading{font-weight:750;font-size:22px;text-align:center;margin-bottom:4px;text-shadow:0 0 10px #70aeef66}
.editor-kicker{text-align:center;color:#adc7e8;font-size:12px;margin-bottom:12px}
.icon-picker-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:12px 3px}
.icon-choice{position:relative!important;min-width:0;aspect-ratio:1/1.05;border-radius:15px!important;padding:6px 2px 5px!important;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:1px solid #70a5ec8a!important;background:linear-gradient(145deg,#5479bd 0%,#1a386f 23%,#091c47 70%,#2a4f8b 100%)!important;box-shadow:inset 0 2px 2px #c4e8ff4f,inset 0 -2px 5px #010a2899,0 3px 7px #0008!important}
.icon-choice.selected{border:2px solid #bce7ff!important;background:linear-gradient(150deg,#4a90e0,#123870 54%,#264e95)!important;box-shadow:0 0 13px #53bdffb5,inset 0 2px 3px #e0faff88!important}
.icon-choice img{height:47px;width:47px;max-width:85%;object-fit:contain;filter:drop-shadow(0 0 3px #b5e2ff55)}
.icon-choice span{font-size:10px;color:#e6f3ff;line-height:1.1;white-space:nowrap}
.icon-choice.selected:after{content:'✓';position:absolute;top:2px;right:5px;color:#77ffa7;font-weight:800;font-size:13px}
.editor-preview{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px 0 14px;padding:13px;border-radius:17px;border:1px solid #77b4ff;background:linear-gradient(140deg,#2d5f9a,#0a224e 40%,#0b1431 80%,#1d427b);box-shadow:inset 0 2px 4px #bddfff72,0 4px 14px #0007}
.editor-preview img{height:63px;width:63px;object-fit:contain}
.editor-preview .preview-title{font-weight:750;font-size:18px;line-height:1.3}.editor-preview .preview-meta{color:#bfdef8;font-size:13px;margin-top:4px}
.editor-controls{display:grid;grid-template-columns:minmax(0,1fr) 90px 90px;gap:8px;align-items:end}
.editor-controls label{font-size:12px;margin:0 0 3px}.editor-controls input{min-width:0;padding:9px!important}
.pass-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:8px 0 0}
.pass-btn{padding:10px 2px!important;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;border-radius:13px!important;font-size:11px;border:1px solid #476497!important;background:linear-gradient(#253956,#101b34)!important;box-shadow:inset 0 2px 4px #accfff39,0 4px 7px #0005!important}
.pass-btn.on{background:linear-gradient(#347fce,#0c3d83 65%,#112e69)!important;border-color:#8bcaff!important;box-shadow:inset 0 2px 5px #d2f8ff75,0 0 11px #319cff8f!important}
.pass-btn .led{display:inline-block;width:9px;height:9px;border-radius:50%;background:#454f64;box-shadow:inset 0 0 3px #000}
.pass-btn.on .led{background:#59ff89;box-shadow:0 0 7px #3dfc78}
.editor-actions button{font-weight:700}.editor-actions .save{background:linear-gradient(#76f1a0,#168446 70%,#07642d)!important;border-color:#b0ffd0!important}
.editor-list .entry{align-items:center}.editor-list img{height:40px;width:40px;object-fit:contain;flex-shrink:0}.editor-list .item-copy{flex:1}
.editor-banner{padding:10px 12px;border:1px solid #527fa9;border-radius:12px;background:#0d264b;font-size:12px;color:#c9dff7;line-height:1.4}
/* The saved custom icon uses a small badge on top of the unchanged original preset artwork. */
.preset-saved-icon{position:absolute;z-index:2;width:5.7%;aspect-ratio:1;pointer-events:none;object-fit:contain;filter:drop-shadow(0 0 5px #ecf8ffaa);display:none}

<script>
(()=>{'use strict';const W=1010,H=1557,$=id=>document.getElementById(id),ctx=$('live').getContext('2d'),pad=n=>String(n).padStart(2,'0');const names=['Meditation','Nap','Meeting','Sleep'],durations=[15,30,60,480];const key='kipquiet-c56-schedules';
const state={hours:0,minutes:45,at:null,end:0,total:0,armed:null,allow:{fav:false,alarms:true,music:false},schedules:[],fired:{}};
try{state.schedules=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(state.schedules))state.schedules=[]}catch{state.schedules=[]}
function save(){try{localStorage.setItem(key,JSON.stringify(state.schedules))}catch{}}

function ellipse(x,y,rx,ry){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2)}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function overlayPill(x,y,w,h,top,bottom){rrect(x,y,w,h,18);const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,top);g.addColorStop(1,bottom);ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#80bced9a';ctx.lineWidth=1.4;ctx.stroke()}

function draw(){const d=new Date(),active=state.end&&state.end>Date.now(),left=Math.max(0,state.end-Date.now());ctx.clearRect(0,0,W,H);
// Replace only the clock interior; preserve the actual oval's outer rim and moonlit scenery.
ellipse(490,203,276,103);ctx.fillStyle='#030b20';ctx.fill();
const secs=d.getSeconds(),progress=active?left/(state.total*60000):((secs+1)/60);
// Arc-length spacing prevents compressed end ticks on an ellipse.
const pts=[];let length=0,prev=null;for(let k=0;k<=2400;k++){let a=-Math.PI/2+2*Math.PI*k/2400,x=490+255*Math.cos(a),y=203+87*Math.sin(a);if(prev)length+=Math.hypot(x-prev.x,y-prev.y);pts.push({a,x,y,L:length});prev={x,y}}
for(let i=0;i<60;i++){let target=(i+.5)*length/60,j=1;while(j<pts.length&&pts[j].L<target)j++;let p=pts[Math.min(j,pts.length-1)],a=p.a;const nx=Math.cos(a)/255,ny=Math.sin(a)/87,norm=Math.hypot(nx,ny),ux=nx/norm,uy=ny/norm;const top=(Math.sin(a)+1)/2;const enabled=(i/60)<progress;let t=(Math.cos(a)+1)/2;let hue=191+94*t;let alpha=enabled?(0.68+top*.22):.095;ctx.strokeStyle=`hsla(${hue},94%,${enabled?76:40}%,${alpha})`;ctx.lineWidth=enabled?9:7;ctx.lineCap='butt';ctx.shadowBlur=enabled?2:0;ctx.shadowColor=`hsla(${hue},90%,72%,.2)`;ctx.beginPath();ctx.moveTo(p.x-ux*5,p.y-uy*5);ctx.lineTo(p.x-ux*26,p.y-uy*26);ctx.stroke()}ctx.shadowBlur=0;

const iconLabels={meditate:'Meditation',nap:'Bed',meeting:'Meeting',moon:'Moon',book:'Book',tea:'Break',spanner:'Spanner',screwdriver:'Screwdriver',crossed:'Crossed tools',briefcase:'Work',car:'Travel',star:'Other'};
const presetColors=['#8e42ef','#188bfa','#f8a309','#0fcbb2'];
const pkey='kipquiet-preset-editor-c58';
const defaults=[{name:'Meditation',minutes:15,icon:'meditate',allow:{fav:false,alarms:false,music:false}},{name:'Nap',minutes:30,icon:'nap',allow:{fav:false,alarms:true,music:true}},{name:'Meeting',minutes:60,icon:'meeting',allow:{fav:true,alarms:true,music:false}},{name:'Sleep',minutes:480,icon:'moon',allow:{fav:false,alarms:true,music:true}}];
let presetDefs=defaults.map(x=>({...x,allow:{...x.allow}}));
try{const fromStore=JSON.parse(localStorage.getItem(pkey)||'null');if(Array.isArray(fromStore)&&fromStore.length===4)presetDefs=fromStore.map((x,i)=>({...defaults[i],...x,allow:{...defaults[i].allow,...x.allow}}))}catch{}
function persistPresets(){try{localStorage.setItem(pkey,JSON.stringify(presetDefs))}catch{}}
function previewCard(i){const item=presetDefs[i];return `<img src="${presetIconAssets[item.icon]||presetIconAssets.star}" alt=""><div class="item-copy"><strong>${esc(item.name)}</strong><small>${item.minutes>=60?Math.floor(item.minutes/60)+'h '+(item.minutes%60?item.minutes%60+'m':''):item.minutes+'m'} · ${['fav','alarms','music'].filter(k=>item.allow[k]).map(k=>k==='fav'?'Favourites':k==='alarms'?'Alarms':'Music').join(' + ')||'No interruptions'}</small></div>`}
function presetManager(){modal(`<div class="editor-heading">Quick Presets</div><div class="editor-kicker">Choose a preset to customise</div><div class="editor-list">${presetDefs.map((p,i)=>`<div class="entry">${previewCard(i)}<button data-pedit="${i}" aria-label="Edit ${esc(p.name)}">Edit</button></div>`).join('')}</div><div class="editor-banner">Tap a preset on the home screen to start immediately. Edit its name, duration, icon, and allowed interruptions here.</div><div class="row"><button id="pclose">Back to home</button></div>`);document.querySelectorAll('[data-pedit]').forEach(el=>el.onclick=()=>presetEditor(+el.dataset.pedit));$('pclose').onclick=close}
function presetEditor(i){const p=structuredClone(presetDefs[i]);let choice=p.icon;let fav=!!p.allow.fav,alarms=!!p.allow.alarms,music=!!p.allow.music;
  modal(`<div class="editor-heading">Edit Preset</div><div class="editor-kicker">${esc(p.name)} · choose your icon</div><div class="editor-preview" id="epreview"><img id="preview-icon" src="${presetIconAssets[choice]}"><div><div class="preview-title" id="preview-name">${esc(p.name)}</div><div class="preview-meta" id="preview-duration">${p.minutes} minutes</div></div></div><div class="icon-picker-grid">${Object.keys(presetIconAssets).map(k=>`<button class="icon-choice ${k===choice?'selected':''}" type="button" data-picon="${k}" aria-label="${iconLabels[k]} icon" aria-pressed="${k===choice}"><img src="${presetIconAssets[k]}" alt=""><span>${iconLabels[k]}</span></button>`).join('')}</div><div class="editor-controls"><div><label for="pname">Name</label><input id="pname" type="text" maxlength="18" value="${esc(p.name)}"></div><div><label for="phours">Hours</label><input id="phours" type="number" min="0" max="23" value="${Math.floor(p.minutes/60)}"></div><div><label for="pmins">Minutes</label><input id="pmins" type="number" min="0" max="59" value="${p.minutes%60}"></div></div><label>Allow through during this preset</label><div class="pass-row">${[['fav','☎','Favourites'],['alarms','⏰','Alarms'],['music','♫','Music']].map(([k,g,l])=>`<button class="pass-btn ${p.allow[k]?'on':''}" data-ptoggle="${k}" type="button"><span style="font-size:22px">${g}</span><span>${l} <span class="led"></span></span></button>`).join('')}</div><div class="row editor-actions"><button id="pback">Cancel</button><button class="save" id="psave">Save Preset</button></div>`);
function refresh(){ $('preview-icon').src=presetIconAssets[choice];$('preview-name').textContent=$('pname').value||'Preset';$('preview-duration').textContent=((+$('phours').value||0)*60+(+$('pmins').value||0))+' minutes';document.querySelectorAll('[data-picon]').forEach(el=>{el.classList.toggle('selected',el.dataset.picon===choice);el.setAttribute('aria-pressed',String(el.dataset.picon===choice))})}
document.querySelectorAll('[data-picon]').forEach(el=>el.onclick=()=>{choice=el.dataset.picon;refresh()});
for(const id of ['pname','phours','pmins'])$(id).oninput=refresh;
document.querySelectorAll('[data-ptoggle]').forEach(el=>el.onclick=()=>{const k=el.dataset.ptoggle;if(k==='fav')fav=!fav;if(k==='alarms')alarms=!alarms;if(k==='music')music=!music;el.classList.toggle('on',{fav,alarms,music}[k])});
$('pback').onclick=presetManager;
$('psave').onclick=()=>{let total=Math.max(0,Math.min(23,+$('phours').value||0))*60+Math.max(0,Math.min(59,+$('pmins').value||0));if(total<1){toast('Set a duration of at least one minute');return}presetDefs[i]={name:$('pname').value.trim()||p.name,minutes:total,icon:choice,allow:{fav,alarms,music}};persistPresets();refreshPresetBadges();toast('Preset saved');presetManager();};
}
// The approved image is a single raster illustration. Keep it intact; expose edited icon in a small, non-overlapping badge.
function refreshPresetBadges(){ for(let i=0;i<4;i++){const im=$('pbadge'+i);const p=presetDefs[i];if(p.icon!==defaults[i].icon){im.src=presetIconAssets[p.icon];im.style.display='block'}else im.style.display='none'}}
for(let i=0;i<4;i++){const img=document.createElement('img');img.id='pbadge'+i;img.className='preset-saved-icon';img.alt='Selected preset icon';img.style.top='24.9%';img.style.left=(7.3+23.95*i)+'%';$('phone').appendChild(img)}
refreshPresetBadges();
for(const b of document.querySelectorAll('[data-p]'))b.onclick=()=>{let p=presetDefs[+b.dataset.p];state.at=null;state.allow={...p.allow};begin(p.minutes);toast(p.name+' started')};
// Gear opens the real preset configuration menu rather than an informational popup.
$('settings').onclick=()=>presetManager();
// Long press on a preset opens its editor; short tap still starts immediately.
for(const b of document.querySelectorAll('[data-p]')){let timer=null,held=false;const i=+b.dataset.p;b.addEventListener('contextmenu',e=>{e.preventDefault();presetEditor(i)});b.addEventListener('pointerdown',()=>{held=false;timer=setTimeout(()=>{held=true;presetEditor(i)},650)});for(const ev of ['pointerup','pointerleave','pointercancel'])b.addEventListener(ev,()=>clearTimeout(timer));b.addEventListener('click',e=>{if(held){e.stopImmediatePropagation();held=false}},true)}

setInterval(()=>{check();draw()},250);draw();
})();
</script></body></html>
