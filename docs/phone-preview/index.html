<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#101b39"><title>KipQuiet phone preview</title><style>
*{box-sizing:border-box}body{margin:0;color:#edf2ff;font:15px system-ui;background:radial-gradient(ellipse at 50% 0%,#314e86 0%,#17264a 38%,#0c142c 75%);min-height:100vh}.app{max-width:440px;margin:auto;padding:14px 16px 30px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:800;letter-spacing:1px;background:linear-gradient(90deg,#a8d7ff,#d8b4ff);color:transparent;background-clip:text}.gear{border:0;background:#30466c;color:white;border-radius:12px;padding:9px 13px;font-size:21px}.clock{position:relative;margin:18px 0 10px;height:220px;display:grid;place-items:center}.ring{position:absolute;inset:0;width:100%;height:100%}.tick{position:absolute;width:3px;height:15px;border-radius:3px;transform-origin:center;background:#7282ae;opacity:.18;transition:opacity .2s,background .2s;box-shadow:0 0 2px #95a9d7}.tick.on{opacity:.78;background:linear-gradient(#9dd8f7,#bd9ae8);box-shadow:0 0 5px #899bd6}.tick.lead{opacity:1;background:#e1caff;box-shadow:0 0 8px #b9a9ff}.face{position:relative;text-align:center;margin-top:3px}.time{font-size:49px;font-weight:650;letter-spacing:1px;color:#d5e3fb;text-shadow:0 0 12px #6785ba55;font-variant-numeric:tabular-nums}.sub{font-size:12px;color:#aabddd;letter-spacing:2px}.section{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 9px;font-weight:700;color:#d8e4ff}.presets{display:grid;grid-template-columns:1fr 1fr;gap:10px}.preset{min-height:118px;border:1px solid #ffffff50;border-radius:18px;color:white;padding:12px 10px 10px;box-shadow:inset 0 2px 3px #ffffff4a,inset 0 -8px 15px #07112a77,0 7px 10px #0006;text-align:left;display:flex;flex-direction:column;justify-content:space-between}.preset .main{display:flex;gap:8px;align-items:center}.art{font-size:28px}.pname{font-weight:750;font-size:16px}.pmins{font-size:12px;opacity:.9}.statuses{border-top:1px solid #ffffff40;padding-top:7px;display:flex;justify-content:space-around;font-size:19px}.off{opacity:.35;filter:grayscale(1)}.med{background:linear-gradient(140deg,#3777bb,#203a78)}.nap{background:linear-gradient(140deg,#198e9b,#164e7a)}.meet{background:linear-gradient(140deg,#8364b8,#493c80)}.sleep{background:linear-gradient(140deg,#c48645,#74502e)}.panel{border:1px solid #6a83b066;border-radius:20px;background:linear-gradient(160deg,#2b3f6b,#142447);padding:14px;box-shadow:inset 0 2px 3px #ffffff2c,0 10px 18px #0005}.line{display:flex;align-items:center;gap:10px;justify-content:space-between;margin:8px 0}.pill{background:#0c1c3d;border:1px solid #637ca7;border-radius:12px;color:#e4efff;padding:10px;font:inherit;min-width:0}.select{flex:1}.wheels{display:flex;gap:8px;justify-content:center;align-items:center}.wheel{display:flex;align-items:center;gap:5px;border-radius:13px;background:linear-gradient(#344b77,#132344);border:1px solid #8299c3;padding:5px}.wheel button{background:transparent;border:0;color:#bcd7ff;font-size:23px;padding:8px 5px}.num{font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;min-width:30px;text-align:center}.label{font-size:12px;color:#b8c9e7}.allow{display:flex;gap:8px}.allow button{flex:1;border-radius:13px;border:1px solid #536580;background:linear-gradient(#273858,#14213c);color:#8190a7;padding:8px 3px;font-size:13px;box-shadow:inset 0 2px 2px #ffffff19}.allow button.active{color:white;border-color:#8ac7fa;background:linear-gradient(#386eb2,#204781);box-shadow:inset 0 2px 3px #ffffff6c,0 0 10px #5f98f844}.led{display:block;width:6px;height:6px;border-radius:50%;background:#536174;margin:0 4px 2px auto}.active .led{background:#6ff5a2;box-shadow:0 0 6px #75ffa4}.start{width:100%;border:1px solid #8de2b2;border-radius:13px;padding:13px;background:linear-gradient(#58c996,#16844d);color:white;font-size:17px;font-weight:800;margin-top:12px;box-shadow:inset 0 2px 3px #ffffff66,0 5px 12px #0006}.muted{color:#b7c9e6;font-size:13px}.sched{width:100%;border:1px solid #667fb0;border-radius:12px;background:#243b66;color:#e2eafa;padding:12px;text-align:left;margin-top:8px;font:inherit}.hidden{display:none}dialog{border:1px solid #8298c3;background:#152548;color:#fff;border-radius:18px;width:min(95vw,420px)}dialog input,dialog select{padding:10px;background:#0c1935;color:white;border:1px solid #647ca4;border-radius:9px}dialog label{display:block;margin:10px 0}.days{display:flex;gap:6px;flex-wrap:wrap}.days label{font-size:12px;margin:0}.actions{display:flex;gap:10px;margin-top:14px}.actions button{padding:10px;border-radius:10px;background:#345b92;color:white;border:0;flex:1}
</style><main class="app"><header class="top"><div class="logo">KipQuiet</div><button class="gear" onclick="openSchedules()">⚙</button></header><section class="clock"><div class="ring" id="ring"></div><div class="face"><div class="time" id="clockText">--:--</div><div class="sub" id="clockSub">SECONDS • LIVE CLOCK</div></div></section><div class="section">Quick Presets <span class="muted">Tap to start</span></div><section class="presets" id="presets"></section><div class="section">Quick Timer <span class="muted">One-off</span></div><section class="panel"><div class="line"><span>Starts</span><select class="pill select" id="mode" onchange="updateUI()"><option value="now">Now</option><option value="later">At a time…</option></select></div><div class="line hidden" id="future"><span class="label">Start at</span><input class="pill" id="startAt" type="time" value="13:00" onchange="updateUI()"></div><div class="line"><span>Runs for</span><div class="wheels"><div class="wheel"><button onclick="step('hours',-1)">−</button><span class="num" id="hours">00</span><button onclick="step('hours',1)">+</button></div><div class="wheel"><button onclick="step('minutes',-1)">−</button><span class="num" id="minutes">45</span><button onclick="step('minutes',1)">+</button></div></div></div><div class="line label"><span></span><span>HOURS　　　　　　　　 MINUTES</span></div><div class="line"><span class="muted">Finishes</span><strong id="finishes">—</strong></div><div class="section" style="margin:15px 0 8px;font-size:13px">Allow through</div><div class="allow" id="allow"></div><button class="start" id="start" onclick="toggleTimer()">▶ Start Sleep Timer</button></section><button class="sched" id="next" onclick="openSchedules()">Next schedule: None saved</button><button class="sched" onclick="openSchedules()">Manage Schedules　›</button></main><dialog id="scheduleDialog"><h3>Manage Schedules</h3><div id="scheduleList" class="muted"></div><label>Name <input id="sname" value="Meeting"></label><label>Start <input type="time" id="stime" value="13:00"></label><label>Duration (minutes) <input type="number" id="sdur" value="45" min="1"></label><div class="label" style="margin:10px 0">Repeat on selected days (leave blank for one-off)</div><div class="days" id="days"></div><div class="actions"><button onclick="saveSchedule()">Save schedule</button><button onclick="scheduleDialog.close()">Close</button></div></dialog><script>
const $=id=>document.getElementById(id);const pad=n=>String(n).padStart(2,'0');let duration=45,allowed={favourites:false,alarms:true,music:false},running=null,armed=null,selectedPreset=null;const defs=[['Meditation','🧘',15,'med'],['Nap','🛏️',30,'nap'],['Meeting','👥',45,'meet'],['Sleep','🌙',90,'sleep']];let presets=JSON.parse(localStorage.getItem('kq-presets')||'null')||defs.map((d,i)=>({name:d[0],icon:d[1],minutes:d[2],cls:d[3],allowed:{favourites:false,alarms:true,music:i===0}}));let schedules=JSON.parse(localStorage.getItem('kq-schedules')||'[]');let ticks=[];
function renderPresets(){ $('presets').innerHTML='';presets.forEach((p,i)=>{let b=document.createElement('button');b.className='preset '+p.cls;b.innerHTML='<div class="main"><span class="art">'+p.icon+'</span><span><div class="pname">'+p.name+'</div><div class="pmins">'+p.minutes+' min</div></span></div><div class="statuses">'+['favourites','alarms','music'].map((k,j)=>'<span title="'+k+'" class="'+(p.allowed[k]?'':'off')+'">'+['☎★','♟','♫'][j]+(p.allowed[k]?'':'̸')+'</span>').join('')+'</div>';b.onclick=()=>{duration=p.minutes;allowed={...p.allowed};$('mode').value='now';updateUI();startTimer(duration)};$('presets').append(b)})}
function renderAllow(){$('allow').innerHTML='';[['favourites','☎★'],['alarms','🔔'],['music','♫']].forEach(([k,ico])=>{let b=document.createElement('button');b.className=allowed[k]?'active':'';b.innerHTML='<span class="led"></span>'+ico+'<div style="font-size:11px;margin-top:4px">'+k[0].toUpperCase()+k.slice(1)+'</div>';b.onclick=()=>{allowed[k]=!allowed[k];renderAllow()};$('allow').append(b)})}
function step(which,n){let h=Math.floor(duration/60),m=duration%60;if(which==='hours')h=Math.max(0,Math.min(23,h+n));else{m+=n;if(m<0){m=59;h=Math.max(0,h-1)}if(m>59){m=0;h=Math.min(23,h+1)}}duration=h*60+m;updateUI()}
function fmt(d){return d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}function startDate(){let d=new Date();if($('mode').value==='later'){let [h,m]=$('startAt').value.split(':').map(Number);d.setHours(h,m,0,0);if(d<=new Date())d.setDate(d.getDate()+1)}return d}
function updateUI(){$('future').classList.toggle('hidden',$('mode').value!=='later');$('hours').textContent=pad(Math.floor(duration/60));$('minutes').textContent=pad(duration%60);let end=startDate();end.setMinutes(end.getMinutes()+duration);$('finishes').textContent=fmt(end)+' '+(end.toDateString()===new Date().toDateString()?'today':'later');$('start').textContent=running?'■ Stop Timer':armed?'✕ Cancel Scheduled Start':$('mode').value==='later'?'◷ Set Sleep Timer':'▶ Start Sleep Timer';renderAllow()}
function startTimer(m){if(!m)return;armed=null;running={end:Date.now()+m*60000,total:m*60000};updateUI();tick()}
function toggleTimer(){if(running||armed){running=null;armed=null;updateUI();return}if(duration<=0){alert('Choose a duration');return}if($('mode').value==='later'){armed={start:startDate().getTime(),minutes:duration};updateUI()}else startTimer(duration)}
function drawRing(){const el=$('ring');el.innerHTML='';ticks=[];const W=350,H=220,cx=175,cy=110,rx=157,ry=79;let pts=[];for(let i=0;i<2400;i++){let a=i*Math.PI*2/2400,x=cx+rx*Math.sin(a),y=cy-ry*Math.cos(a);if(i){let p=pts[i-1];pts.push({a,x,y,len:p.len+Math.hypot(x-p.x,y-p.y)})}else pts.push({a,x,y,len:0})}let total=pts.at(-1).len;for(let i=0;i<60;i++){let target=i*total/60,p=pts.find(q=>q.len>=target)||pts.at(-1);let e=document.createElement('i');e.className='tick';e.style.left=(p.x/W*100)+'%';e.style.top=(p.y/H*100)+'%';e.style.transform='translate(-50%,-50%) rotate('+(p.a*180/Math.PI)+'deg)';e.style.opacity='.13';el.append(e);ticks.push(e)}}
function tick(){let now=new Date(),seconds=now.getSeconds(),progress=seconds;let active=!!running;if(running&&Date.now()>=running.end){running=null;updateUI();active=false}if(armed&&Date.now()>=armed.start)startTimer(armed.minutes);if(active){let left=Math.max(0,Math.ceil((running.end-Date.now())/1000));$('clockText').textContent=pad(Math.floor(left/3600))+':'+pad(Math.floor(left%3600/60))+':'+pad(left%60);$('clockText').style.fontSize='35px';$('clockSub').textContent='COUNTDOWN';progress=Math.ceil(60*(running.end-Date.now())/running.total)}else{$('clockText').textContent=fmt(now);$('clockText').style.fontSize='49px';$('clockSub').textContent=armed?'ARMED • STARTS '+fmt(new Date(armed.start)):'SECONDS • LIVE CLOCK'}ticks.forEach((t,i)=>{t.className='tick'+(i<progress?' on':'')+(i===progress-1?' lead':'');t.style.opacity=i<progress?(.43+.4*((t.offsetTop/220))):'.11'});updateNext()}
function nextOccurrence(s){let now=new Date(),[h,m]=s.time.split(':').map(Number);for(let k=0;k<8;k++){let d=new Date();d.setDate(d.getDate()+k);d.setHours(h,m,0,0);if(d<=now)continue;if(s.days.length&&!s.days.includes(d.getDay()))continue;if(!s.days.length&&s.once&&s.once!==d.toDateString())continue;return d}return null}
function updateNext(){let next=schedules.map(s=>({s,d:nextOccurrence(s)})).filter(x=>x.d).sort((a,b)=>a.d-b.d)[0];$('next').textContent=next?'Next schedule: '+next.s.name+' • '+next.d.toLocaleDateString('en-GB',{weekday:'short'})+' '+fmt(next.d):'Next schedule: None saved'}
function openSchedules(){renderScheduleList();$('scheduleDialog').showModal()}function renderScheduleList(){$('scheduleList').innerHTML=schedules.length?schedules.map((s,i)=>'<p>'+s.name+' • '+s.time+' • '+s.duration+' min • '+(s.days.length?s.days.map(n=>['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][n]).join(', '):'Once')+' <button onclick="deleteSchedule('+i+')">Delete</button></p>').join(''):'No schedules saved yet'}
function deleteSchedule(i){schedules.splice(i,1);localStorage.setItem('kq-schedules',JSON.stringify(schedules));renderScheduleList();updateNext()}
function saveSchedule(){let days=[...document.querySelectorAll('#days input:checked')].map(x=>+x.value),s={name:$('sname').value||'Schedule',time:$('stime').value,duration:Math.max(1,+$('sdur').value||45),days};if(!days.length){let d=new Date();let [h,m]=s.time.split(':').map(Number);d.setHours(h,m,0,0);if(d<=new Date())d.setDate(d.getDate()+1);s.once=d.toDateString()}schedules.push(s);localStorage.setItem('kq-schedules',JSON.stringify(schedules));renderScheduleList();updateNext()}
$('days').innerHTML=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map((x,i)=>'<label><input type="checkbox" value="'+i+'">'+x+'</label>').join('');renderPresets();drawRing();updateUI();tick();setInterval(tick,200);
</script></html>
